<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>蛊真人 · 魔道长生</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <!-- 开场剧情 -->
  <section id="intro-screen" class="screen active">
    <div class="intro-wrap">
      <h1 class="game-title">蛊真人</h1>
      <p class="game-sub">魔道长生 · Demo</p>
      <div class="intro-text" id="intro-text"></div>
      <button class="btn btn-primary" id="intro-next">继续</button>
    </div>
  </section>

  <!-- 开窍大典 -->
  <section id="ceremony-screen" class="screen">
    <div class="ceremony-wrap">
      <h2>开窍大典</h2>
      <p class="ceremony-desc">地下溶洞，月兰花海幽蓝如星河。踏入花海，走得越远，资质越好。资质分甲乙丙丁四等。</p>
      <div class="flower-sea">
        <div class="sea-track">
          <div class="sea-player" id="sea-player">方源</div>
          <div class="sea-mark" style="left:5.4%">丁</div>
          <div class="sea-mark" style="left:18%">丙</div>
          <div class="sea-mark" style="left:54%">乙</div>
          <div class="sea-mark" style="left:90%">甲</div>
        </div>
      </div>
      <div class="ceremony-result" id="ceremony-result"></div>
      <button class="btn btn-primary" id="ceremony-start">踏入花海</button>
      <button class="btn btn-primary hidden" id="ceremony-confirm">继承五百年记忆，重生开始</button>
    </div>
  </section>

  <!-- 主游戏界面 -->
  <section id="game-screen" class="screen">
    <!-- 状态栏 -->
    <header class="status-bar">
      <div class="status-item"><span class="label">姓名</span><span class="val" id="st-name">方源</span></div>
      <div class="status-item"><span class="label">境界</span><span class="val" id="st-rank">凡人</span></div>
      <div class="status-item"><span class="label">资质</span><span class="val" id="st-apt">—</span></div>
      <div class="status-item"><span class="label">日数</span><span class="val" id="st-day">1</span></div>
      <div class="status-item"><span class="label">元海</span><span class="val" id="st-sea">0/0</span></div>
      <div class="status-item"><span class="label">元石</span><span class="val" id="st-stone">0</span></div>
    </header>

    <!-- 修为进度 -->
    <div class="cult-bar-wrap">
      <span class="cult-label">修为</span>
      <div class="cult-bar"><div class="cult-fill" id="cult-fill"></div></div>
      <span class="cult-num" id="cult-num">0/100</span>
    </div>

    <div class="game-body">
      <!-- 场景日志 -->
      <div class="log-panel">
        <div class="log-title">事迹</div>
        <div class="log-box" id="log-box"></div>
      </div>

      <!-- 行动 -->
      <div class="action-panel">
        <div class="action-title">行动</div>
        <div class="action-grid">
          <button class="action-btn" data-act="cultivate">修炼</button>
          <button class="action-btn" data-act="explore">探索</button>
          <button class="action-btn" data-act="gu">养蛊</button>
          <button class="action-btn" data-act="battle">历练</button>
          <button class="action-btn" data-act="clan">家族</button>
          <button class="action-btn" data-act="rest">歇息</button>
        </div>
        <div class="action-title" style="margin-top:1rem;">蛊袋 <span class="gu-count" id="gu-count">0/0</span></div>
        <div class="gu-list" id="gu-list"></div>
      </div>
    </div>
  </section>

  <!-- 战斗界面 -->
  <section id="battle-screen" class="screen overlay">
    <div class="battle-wrap">
      <h2 id="battle-title">战斗</h2>
      <div class="battle-field">
        <div class="battle-side enemy-side">
          <div class="entity-name" id="enemy-name">山猪</div>
          <div class="hp-bar"><div class="hp-fill" id="enemy-hp-fill"></div></div>
          <div class="hp-text" id="enemy-hp-text">100/100</div>
          <div class="enemy-intent" id="enemy-intent"></div>
        </div>
        <div class="battle-side player-side">
          <div class="entity-name" id="player-battle-name">方源</div>
          <div class="hp-bar"><div class="hp-fill player" id="player-hp-fill"></div></div>
          <div class="hp-text" id="player-hp-text">100/100</div>
          <div class="battle-sea">元海：<span id="battle-sea-val">0</span></div>
        </div>
      </div>
      <div class="battle-log" id="battle-log"></div>
      <div class="battle-actions">
        <div class="battle-gu-grid" id="battle-gu-grid"></div>
        <button class="btn btn-warn" id="battle-flee">逃离</button>
      </div>
    </div>
  </section>

  <!-- 通用弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title" id="modal-title">提示</div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
